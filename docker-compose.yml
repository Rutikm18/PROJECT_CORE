# =============================================================================
#  docker-compose.yml — AttackLens Manager (Caddy reverse proxy + Manager)
#
#  SETUP (run once before first boot):
#    bash env.sh          ← generates .env + Caddyfile interactively
#
#  START:
#    docker compose up -d
#
#  LOGS:
#    docker compose logs -f
#
#  ARCHITECTURE:
#    Internet → Caddy (TLS) → manager (plain HTTP, internal only)
#
#    Caddy handles all TLS — either:
#      • Self-signed internal cert (IP-only, port 8443)
#      • Let's Encrypt cert (domain, port 443)
#
#    Manager is NOT directly exposed to the internet.
#    Only Caddy can reach it via Docker internal network.
#
#    threat-intel is the central reusable intelligence service:
#      • owns NVD / IOC feed sync
#      • stores shared intel in /app/data/intel.db
#      • exposes APIs for multiple dashboards/managers
# =============================================================================

services:

  # ── Database (manager.db + intel.db + threat_intel.db, one Postgres) ───────
  postgres:
    image: postgres:16-alpine
    container_name: attacklens-postgres
    restart: unless-stopped
    logging: &default-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_USER:     "${POSTGRES_USER:-attacklens}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-attacklens}"
      POSTGRES_DB:       "manager"
    ports:
      # Internal only — bind to loopback so a bare-metal / NAT host (no cloud
      # security group in front) never leaks the database to the internet.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - attacklens_pg_data:/var/lib/postgresql/data
      - ./manager/postgres-init:/docker-entrypoint-initdb.d:ro
    networks:
      - attacklens_internal
    healthcheck:
      # -d targets the real DB so the probe stops logging the misleading
      # `database "<user>" does not exist` FATAL on every interval.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-attacklens} -d ${POSTGRES_DB:-manager}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # ── Message broker ───────────────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: attacklens-rabbitmq
    restart: unless-stopped
    logging: *default-logging
    ports:
      # Internal only — broker (5672) and management UI (15672) must never be
      # internet-reachable. Loopback bind is the bare-metal safety net.
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER:-attacklens}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASS:-changeme}"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - attacklens_internal
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_listener", "5672"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 40s

  # ── TLS reverse proxy ────────────────────────────────────────────────────────
  caddy:
    image: caddy:2-alpine
    container_name: attacklens-caddy
    restart: unless-stopped

    # Exposes the public-facing port(s) set by env.sh:
    #   8443 → self-signed (IP-only mode)
    #   443  → Let's Encrypt (domain mode)
    ports:
      # BIND_ADDR scopes the listener. Defaults to all interfaces so remote
      # agents can reach an internet-facing manager; set BIND_ADDR=127.0.0.1
      # in .env on a laptop so a local install is not internet-reachable.
      - "${BIND_ADDR:-0.0.0.0}:${BIND_PORT:-8443}:${BIND_PORT:-8443}"
      - "${BIND_ADDR:-0.0.0.0}:80:80"     # needed for Let's Encrypt ACME HTTP-01 challenge

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro   # generated by env.sh
      - caddy_data:/data                       # ACME certs + Caddy state
      - caddy_config:/config                   # Caddy runtime config

    networks:
      - attacklens_internal

    depends_on:
      manager:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── Application ──────────────────────────────────────────────────────────────
  manager:
    build:
      context: .
      dockerfile: manager/Dockerfile
      args:
        # Git-derived build metadata (deploy.yml/manual deploys set these).
        APP_VERSION:  "${APP_VERSION:-}"
        APP_COMMIT:   "${APP_COMMIT:-}"
        APP_BUILT_AT: "${APP_BUILT_AT:-}"
    image: attacklens-manager:latest
    container_name: attacklens-manager
    restart: unless-stopped

    # Manager exposed on 8080 for direct agent access (no TLS — use on trusted networks)
    # Also reachable via Caddy on :8443 (HTTPS) or :80 (HTTP)
    ports:
      # Manager is reached through Caddy; direct 8080 is for local debugging.
      - "${BIND_ADDR:-0.0.0.0}:8080:8080"

    environment:
      PUBLIC_IP:               "${PUBLIC_IP:-}"
      DOMAIN:                  "${DOMAIN:-}"

      ENROLLMENT_TOKENS:       "${ENROLLMENT_TOKENS:-}"
      ADMIN_TOKEN:             "${ADMIN_TOKEN:-}"
      OPEN_ENROLLMENT:         "${OPEN_ENROLLMENT:-true}"

      # Signs dashboard sessions (api/auth_ui.py) and derives the AES key that
      # encrypts the stored AI provider key (ai/key_store.py). Unset means
      # sessions reset on every restart and the AI key falls back to a random
      # file beside its own ciphertext. env.sh generates this.
      JWT_SECRET:              "${JWT_SECRET:-}"

      # Dashboard login. Without these the manager falls back to a password
      # hardcoded in auth_ui.py — identical on every install — so leaving them
      # unset means this deployment shares its admin credential with everyone
      # else running AttackLens. env.sh generates the hash; see .env.example.
      DASHBOARD_EMAIL:         "${DASHBOARD_EMAIL:-}"
      DASHBOARD_PASSWORD_HASH: "${DASHBOARD_PASSWORD_HASH:-}"

      DEFAULT_KEY_EXPIRY_DAYS: "${DEFAULT_KEY_EXPIRY_DAYS:-0}"

      LOG_LEVEL:               "${LOG_LEVEL:-info}"
      LOG_FILE:                "/app/logs/manager.log"
      DATA_DIR:                "/app/data"
      # Single-process default; deploy/docker-compose.ha.yml splits these roles.
      MANAGER_ROLES:           "${MANAGER_ROLES:-api,telemetry,detection,maintenance,intel}"
      TELEMETRY_ARCHIVE_ENABLED: "${TELEMETRY_ARCHIVE_ENABLED:-true}"
      # Empty = same-origin only. Do NOT default this to '*': with credentials
      # allowed the CORS layer echoes the caller's origin back when a cookie is
      # present, so any site could call this API on a logged-in admin's session.
      CORS_ORIGINS:            "${CORS_ORIGINS:-}"
      HTTPS_ONLY:              "${HTTPS_ONLY:-true}"

      # Manager always runs plain HTTP — Caddy handles TLS
      BIND_PORT:               "8080"

      # Per-agent ingest rate limits (raised from defaults for demo/single-agent use)
      # Default: rate=10 burst=30 slots=4 — too tight when agent drains a large spool
      AGENT_RATE:              "${AGENT_RATE:-50}"
      AGENT_BURST:             "${AGENT_BURST:-150}"
      AGENT_SLOTS:             "${AGENT_SLOTS:-12}"
      TLS_MODE:                "none"

      # Postgres — base DSN shared by manager.db + intel.db (server.py appends
      # /manager and /intel respectively; override via MANAGER_DATABASE_URL /
      # INTEL_DATABASE_URL if they ever need to live on different hosts).
      DATABASE_URL:            "postgresql://${POSTGRES_USER:-attacklens}:${POSTGRES_PASSWORD:-attacklens}@postgres:5432"

      # RabbitMQ — async ingest pipeline
      RABBITMQ_URL:            "amqp://${RABBITMQ_USER:-attacklens}:${RABBITMQ_PASS:-changeme}@rabbitmq:5672/"

      # Central threat-intel API. Manager still degrades gracefully if unavailable.
      THREAT_INTEL_URL:        "http://threat-intel:8090"
      MANAGER_EMBEDDED_THREAT_INTEL: "${MANAGER_EMBEDDED_THREAT_INTEL:-false}"

      # ── AttackLens precision validation ─────────────────────────────────────
      # Master switch for the cluster→signal validation pipeline (correlation +
      # confidence scoring) before a finding is promoted to is_active=1.
      ATTACKLENS_VALIDATION:            "${ATTACKLENS_VALIDATION:-false}"
      # LLM precision verdict on top of the deterministic gates.
      ATTACKLENS_AI_VALIDATION:         "${ATTACKLENS_AI_VALIDATION:-false}"
      ATTACKLENS_AI_PRECISION_THRESHOLD: "${ATTACKLENS_AI_PRECISION_THRESHOLD:-0.90}"

      # ── AI provider ─────────────────────────────────────────────────────────
      # One-time bootstrap of the encrypted provider store (data/ai_provider.enc).
      # Ignored once a provider is configured — the stored config always wins.
      AI_PROVIDER:             "${AI_PROVIDER:-}"
      AI_MODEL:                "${AI_MODEL:-}"
      AI_API_KEY:              "${AI_API_KEY:-}"
      AI_BASE_URL:             "${AI_BASE_URL:-}"

      # OpenRouter transport: attribution headers plus the spend guard
      # (kill switch, per-minute rate cap, daily USD budget) in ai/providers.py.
      OPENROUTER_APP_URL:      "${OPENROUTER_APP_URL:-https://attacklens.ai}"
      OPENROUTER_APP_TITLE:    "${OPENROUTER_APP_TITLE:-AttackLens}"
      ATTACKLENS_OPENROUTER_ENABLED: "${ATTACKLENS_OPENROUTER_ENABLED:-true}"
      ATTACKLENS_OPENROUTER_MAX_CALLS_PER_MINUTE: "${ATTACKLENS_OPENROUTER_MAX_CALLS_PER_MINUTE:-60}"
      ATTACKLENS_OPENROUTER_DAILY_BUDGET_USD: "${ATTACKLENS_OPENROUTER_DAILY_BUDGET_USD:-25}"
      # Free models train on prompts; sending endpoint telemetry to one is opt-in.
      ATTACKLENS_AI_ALLOW_TRAINING_MODELS: "${ATTACKLENS_AI_ALLOW_TRAINING_MODELS:-false}"

      # ── AI analyst (legacy Anthropic-only path) ─────────────────────────────
      ANTHROPIC_API_KEY:       "${ANTHROPIC_API_KEY:-}"
      AI_ANALYST_MODEL:        "${AI_ANALYST_MODEL:-claude-sonnet-4-6}"
      AI_ANALYST_ENABLED:      "${AI_ANALYST_ENABLED:-true}"
      LANGGRAPH_INVESTIGATIONS_ENABLED: "${LANGGRAPH_INVESTIGATIONS_ENABLED:-true}"
      LANGGRAPH_AUTO_INVESTIGATE:       "${LANGGRAPH_AUTO_INVESTIGATE:-true}"
      LANGGRAPH_AUTO_SEVERITIES:        "${LANGGRAPH_AUTO_SEVERITIES:-critical,high}"
      LANGGRAPH_MAX_REVIEW_ROUNDS:      "${LANGGRAPH_MAX_REVIEW_ROUNDS:-2}"

      # ── Email notifications ─────────────────────────────────────────────────
      SMTP_HOST:               "${SMTP_HOST:-}"
      SMTP_PORT:               "${SMTP_PORT:-587}"
      SMTP_USER:               "${SMTP_USER:-}"
      SMTP_PASS:               "${SMTP_PASS:-}"
      SMTP_FROM:               "${SMTP_FROM:-}"
      SMTP_TLS:                "${SMTP_TLS:-starttls}"
      ALERT_RECIPIENTS:        "${ALERT_RECIPIENTS:-}"
      DIGEST_RECIPIENTS:       "${DIGEST_RECIPIENTS:-}"
      OUTLOOK_CLIENT_ID:       "${OUTLOOK_CLIENT_ID:-}"
      OUTLOOK_CLIENT_SECRET:   "${OUTLOOK_CLIENT_SECRET:-}"
      OUTLOOK_TENANT_ID:       "${OUTLOOK_TENANT_ID:-}"
      OUTLOOK_SENDER:          "${OUTLOOK_SENDER:-}"
      EMAIL_ENABLED:           "${EMAIL_ENABLED:-true}"

      # ── Threat intel keys ───────────────────────────────────────────────────
      ABUSEIPDB_KEY:           "${ABUSEIPDB_KEY:-}"
      OTX_KEY:                 "${OTX_KEY:-}"
      GREYNOISE_KEY:           "${GREYNOISE_KEY:-}"

    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      threat-intel:
        condition: service_healthy

    volumes:
      - ./data:/app/data                                  # SQLite DBs, .secrets, hot/warm/cold store
      - ./logs:/app/logs                                  # Rotating log files
      - ./manager/dashboard:/app/manager/dashboard:ro     # live-reload static UI without rebuild

    networks:
      - attacklens_internal

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      # Generous first-boot window: the very first run creates DB schema and can
      # coincide with threat-intel's initial NVD sync hammering shared Postgres.
      start_period: 120s

  # ── Central reusable threat intelligence service ───────────────────────────
  threat-intel:
    build:
      context: .
      dockerfile: manager/ThreatIntel.Dockerfile
    image: attacklens-threat-intel:latest
    container_name: attacklens-threat-intel
    restart: unless-stopped

    ports:
      - "${THREAT_INTEL_PORT:-8090}:8090"

    environment:
      LOG_LEVEL:                    "${LOG_LEVEL:-info}"
      DATA_DIR:                     "/app/data"
      THREAT_INTEL_DATA_DIR:        "/app/data"
      # Postgres — threat_intel_service.py defaults to localhost:5432 if unset,
      # which inside a container resolves to itself, never the postgres
      # service. (Removed THREAT_INTEL_DB=/app/data/intel.db here — a
      # pre-Postgres-migration SQLite path the code no longer reads.)
      DATABASE_URL:                 "postgresql://${POSTGRES_USER:-attacklens}:${POSTGRES_PASSWORD:-attacklens}@postgres:5432"
      CORS_ORIGINS:                 "${CORS_ORIGINS:-*}"
      THREAT_FEED_INTERVAL_SECONDS: "${THREAT_FEED_INTERVAL_SECONDS:-3600}"
      NVD_SYNC_INTERVAL_SECONDS:    "${NVD_SYNC_INTERVAL_SECONDS:-7200}"
      NVD_SYNC_HOURS:               "${NVD_SYNC_HOURS:-48}"
      NVD_SYNC_MAX_PAGES:           "${NVD_SYNC_MAX_PAGES:-3}"
      NVD_MIRROR_ENABLED:           "${NVD_MIRROR_ENABLED:-true}"
      NVD_API_KEY:                  "${NVD_API_KEY:-}"
      ABUSEIPDB_KEY:                "${ABUSEIPDB_KEY:-}"
      OTX_KEY:                      "${OTX_KEY:-}"
      GREYNOISE_KEY:                "${GREYNOISE_KEY:-}"

    depends_on:
      postgres:
        condition: service_healthy

    volumes:
      - ./data/threat-intel:/app/data
      - ./logs:/app/logs

    networks:
      - attacklens_internal

    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8090/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 25s

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  attacklens_pg_data: # Postgres data (manager + intel + threat_intel databases)
  caddy_data:    # Caddy ACME certificates + state (survives restarts)
  caddy_config:  # Caddy runtime config cache
  rabbitmq_data: # RabbitMQ message persistence

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  attacklens_internal:
    driver: bridge
    # Manager has no public IP — only reachable from caddy via this network
    internal: false   # set true to block all outbound internet from manager
