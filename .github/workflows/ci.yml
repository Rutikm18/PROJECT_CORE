name: CI

on:
  push:
    branches: [main, dev]
    # Skip the auto-version-bump commits so CI doesn't run on its own commits.
    paths-ignore:
      - VERSION
  pull_request:
    branches: [main]

jobs:
  # ── Unit + integration tests ─────────────────────────────────────────────
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    # manager/tests/conftest.py creates and drops a real database per test
    # (pg_manager_dsn / pg_intel_dsn). Without this service those files cannot
    # run at all — which is why they were previously left out of CI entirely.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: attacklens
          POSTGRES_PASSWORD: attacklens
          POSTGRES_DB: manager
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U attacklens -d manager"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      rabbitmq:
        image: rabbitmq:3.13-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: attacklens
          RABBITMQ_DEFAULT_PASS: changeme
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r agent/requirements.txt
          pip install -r manager/requirements.txt
          pip install pytest pytest-asyncio httpx pytest-cov

      # One invocation over all three trees. The previous two steps ran
      # `tests/unit/` and `tests/integration/` — the latter does not exist in
      # the repo, so pytest exited 4 (file or directory not found) and the job
      # could never pass; and neither step touched agent/tests/ or
      # manager/tests/, which is where the overwhelming majority of the suite
      # lives. Those ran only when someone typed `make` locally.
      - name: Run tests
        run: python -m pytest tests/ agent/tests/ manager/tests/ -v --tb=short
        env:
          PYTHONPATH: .
          TEST_POSTGRES_ADMIN_DSN: postgresql://attacklens:attacklens@localhost:5432/postgres
          DATABASE_URL: postgresql://attacklens:attacklens@localhost:5432
          RABBITMQ_TEST_URL: amqp://attacklens:changeme@localhost:5672/

  # ── Detection rule self-tests ────────────────────────────────────────────
  # Each detection module carries an executable harness under `__main__` with
  # its own true-positive / false-positive corpus (~450 assertions in total).
  # They are plain asserts, so a regression exits non-zero and fails the step.
  detections:
    name: Detection self-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r manager/requirements.txt
      - name: Run per-module harnesses
        env:
          PYTHONPATH: .
        run: |
          set -e
          for module in app_vulnerability arp_spoofing binary_integrity \
                        container_security covert_channel defense_evasion \
                        exfiltration lateral_movement package_vulnerability \
                        persistence port_listener privilege_escalation \
                        sbom_posture scheduled_task service_monitor \
                        sysctl_monitor user_account; do
            echo "── $module"
            python -m manager.manager.attacklens.detections."$module" > /dev/null
          done

  # ── Dashboard tests ──────────────────────────────────────────────────────
  frontend:
    name: Dashboard tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: manager/dashboard/templates/Build Smart AttackLens Platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps
      - name: Run vitest
        run: npm test
      - name: Build (typecheck + bundle must succeed)
        run: npm run build

  # ── Linting ───────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff
      # Reported, not gating. The tree carries ~1.5k pre-existing violations,
      # dominated by line-length and statement-style rules that have never been
      # enforced here — none of them a correctness defect (there are zero F821
      # undefined names). Blocking on that today would only train people to
      # ignore a permanently-red check. Drop continue-on-error once the backlog
      # is burned down; the `ruff check --statistics` output below is the
      # running scoreboard for that work.
      - name: ruff check
        continue-on-error: true
        run: ruff check agent/agent/ manager/manager/ shared/ tests/
      - name: ruff summary
        continue-on-error: true
        run: ruff check --statistics agent/agent/ manager/manager/ shared/ tests/

  # ── Security scanning ─────────────────────────────────────────────────────
  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install bandit pip-audit
      # Two passes with different thresholds on purpose: the medium+ report is
      # kept as an artifact for review (it is mostly parameterised SQL that
      # bandit cannot see is safe, and deliberate bind-all-interfaces in a
      # server), while only HIGH severity fails the build. Previously the
      # gating pass ran at -ll, so 140 reviewed-and-accepted medium findings
      # kept this job permanently red.
      - name: bandit (report, medium+)
        run: |
          bandit -r agent/agent/ manager/manager/ shared/ \
            -ll --skip B101,B603,B607 \
            -f json -o bandit-report.json || true
      - name: bandit (gate, high only)
        run: |
          bandit -r agent/agent/ manager/manager/ shared/ \
            -lll --skip B101,B603,B607
      - name: pip-audit (CVE scan)
        run: |
          pip-audit --requirement agent/requirements.txt
          pip-audit --requirement manager/requirements.txt
      - name: Upload bandit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json
